<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-1:#fff3c4;
    --gold-2:#e8b84b;
    --gold-3:#9a6a12;
    --red-1:#8a0303;
    --red-2:#c40808;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#04040a;
    overflow:hidden;
    font-family:'Cormorant Garamond',serif;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#04040a;
  }
  #frame{
    position:relative;
    width:100%;height:100%;
    max-width:562px; /* keeps 941:1672 ratio inside typical viewport */
    aspect-ratio:941/1672;
    overflow:hidden;
    background:#000;
    touch-action:none;
    box-shadow:0 0 80px rgba(0,0,0,.8);
  }
  @media (min-height: 700px){
    #frame{ height:min(100vh, 940px); width:auto; }
  }
  #frame img, #frame video, #frame canvas{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  #sceneResult{ opacity:0; transition:opacity 1.6s ease; }
  #dome{
    cursor:grab;
    will-change:transform,opacity;
    filter:drop-shadow(0 30px 25px rgba(0,0,0,.35));
  }
  #dome.dragging{ cursor:grabbing; transition:none; }
  #dome.returning{ transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  #dome.removed{ transition:transform 1s cubic-bezier(.5,0,.75,0), opacity 1s ease; }

  #particleCanvas{ pointer-events:none; z-index:5; }

  #hint{
    position:absolute; left:0; right:0; bottom:8%;
    text-align:center; color:#f5e6c8;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(14px,3.6vw,18px);
    letter-spacing:.06em;
    text-shadow:0 2px 10px rgba(0,0,0,.8);
    opacity:0; animation:hintFade 1.5s ease .8s forwards;
    z-index:6; pointer-events:none;
  }
  #hint .arrow{ display:block; font-size:1.4em; animation:bob 1.6s ease-in-out infinite; }
  @keyframes hintFade{ to{opacity:.92;} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  #hint.hide{ opacity:0!important; transition:opacity .4s ease; }

  #convite-real{
    position:absolute; left:50%; top:60%;
    transform:translate(-50%,-50%) scale(.85);
    z-index:7; opacity:0; pointer-events:none;
    text-align:center; white-space:nowrap;
    font-family:'Great Vibes', cursive;
    font-size:clamp(40px,13vw,78px);
    background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 45%,var(--gold-3) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:none;
    filter:
      drop-shadow(0 0 2px var(--red-2))
      drop-shadow(0 0 10px rgba(196,8,8,.55))
      drop-shadow(0 2px 0 var(--red-1))
      drop-shadow(0 4px 6px rgba(0,0,0,.55));
    transition:opacity 1.4s ease, transform 1.4s cubic-bezier(.2,.8,.2,1);
  }
  #convite-real.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  #videoLayer{
    position:absolute; inset:0; background:#000;
    opacity:0; pointer-events:none; transition:opacity 1.2s ease; z-index:20;
  }
  #videoLayer.show{ opacity:1; pointer-events:auto; }
  #videoLayer video{ opacity:0; transition:opacity .8s ease; }
  #videoLayer video.active{ opacity:1; }

  #blackout{
    position:absolute; inset:0; background:#000; opacity:0;
    transition:opacity 1s ease; z-index:15; pointer-events:none;
  }
  #blackout.show{ opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <img id="sceneBg" src="primeira.jpg" alt="">
    <img id="sceneResult" src="resultadodeflorecer.jpg" alt="">
    <canvas id="particleCanvas"></canvas>
    <div id="convite-real">Convite Real</div>
    <img id="dome" src="sobreposicaoprimeira.jpg" alt="">
    <div id="hint"><span class="arrow">☝</span>Arraste a redoma para cima</div>
    <div id="blackout"></div>
    <div id="videoLayer">
      <video id="v1" src="video1.mp4" playsinline></video>
      <video id="v2" src="video2.mp4" playsinline></video>
      <video id="v3" src="video3.mp4" playsinline></video>
    </div>
  </div>
</div>

<script>
const dome = document.getElementById('dome');
const hint = document.getElementById('hint');
const frame = document.getElementById('frame');
const sceneResult = document.getElementById('sceneResult');
const conviteReal = document.getElementById('convite-real');
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const blackout = document.getElementById('blackout');
const videoLayer = document.getElementById('videoLayer');

let dragging=false, startY=0, currentDelta=0, removed=false;

function resizeCanvas(){
  const r = frame.getBoundingClientRect();
  canvas.width = r.width; canvas.height = r.height;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ---- Drag interaction ----
dome.addEventListener('pointerdown', (e)=>{
  if(removed) return;
  dragging = true;
  startY = e.clientY;
  dome.classList.remove('returning');
  dome.classList.add('dragging');
  dome.setPointerCapture(e.pointerId);
  hint.classList.add('hide');
});

dome.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  let dy = startY - e.clientY;
  if(dy < 0) dy = 0;
  currentDelta = dy;
  const fade = Math.max(0, 1 - dy/420);
  dome.style.transform = `translateY(${-dy}px) rotate(${-dy*0.02}deg)`;
  dome.style.opacity = fade;
});

function endDrag(e){
  if(!dragging) return;
  dragging = false;
  dome.classList.remove('dragging');
  if(currentDelta > 140){
    liftDomeAway();
  } else {
    dome.classList.add('returning');
    dome.style.transform = 'translateY(0) rotate(0deg)';
    dome.style.opacity = 1;
    hint.classList.remove('hide');
  }
  currentDelta = 0;
}
dome.addEventListener('pointerup', endDrag);
dome.addEventListener('pointercancel', endDrag);

// ---- Sequence after dome is lifted ----
function liftDomeAway(){
  removed = true;
  dome.classList.add('removed');
  dome.style.transform = 'translateY(-1300px) rotate(-8deg)';
  dome.style.opacity = '0';

  startParticles();

  setTimeout(()=>{ sceneResult.style.opacity = '1'; }, 450);

  setTimeout(()=>{
    conviteReal.classList.add('show');
  }, 1300);

  setTimeout(()=>{
    conviteReal.style.opacity = '0';
  }, 3600);

  setTimeout(()=>{
    blackout.classList.add('show');
  }, 4600);

  setTimeout(()=>{
    startVideoSequence();
  }, 5600);
}

// ---- Particle system: red smoke + gold glitter ----
let particles = [];
let particleAnimId = null;
let particleStart = 0;
const PARTICLE_DURATION = 3200;

function startParticles(){
  particles = [];
  const r = frame.getBoundingClientRect();
  const originX = r.width * 0.50;
  const originY = r.height * 0.615;

  for(let i=0;i<38;i++){
    particles.push(makeSmoke(originX, originY));
  }
  for(let i=0;i<70;i++){
    particles.push(makeGlitter(originX, originY));
  }
  particleStart = performance.now();
  if(particleAnimId) cancelAnimationFrame(particleAnimId);
  animateParticles();
}

function makeSmoke(ox,oy){
  const angle = Math.random()*Math.PI*2;
  const radius = 10 + Math.random()*40;
  return{
    type:'smoke',
    x: ox + Math.cos(angle)*radius,
    y: oy + Math.sin(angle)*radius*0.4,
    baseX: ox, baseY: oy,
    angle: angle,
    orbit: 30 + Math.random()*70,
    speed: 0.02 + Math.random()*0.02,
    rise: 0.35 + Math.random()*0.55,
    size: 18 + Math.random()*46,
    delay: Math.random()*400,
    alpha: 0
  };
}
function makeGlitter(ox,oy){
  const angle = Math.random()*Math.PI*2;
  const radius = 5 + Math.random()*60;
  return{
    type:'glitter',
    x: ox + Math.cos(angle)*radius,
    y: oy + Math.sin(angle)*radius*0.4,
    baseX: ox, baseY: oy,
    angle: angle,
    orbit: 20 + Math.random()*90,
    speed: 0.035 + Math.random()*0.035,
    rise: 0.5 + Math.random()*0.9,
    size: 1.4 + Math.random()*2.6,
    twinkle: Math.random()*Math.PI*2,
    delay: Math.random()*600,
    alpha: 0
  };
}

function animateParticles(){
  const now = performance.now();
  const elapsed = now - particleStart;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    const t = elapsed - p.delay;
    if(t < 0) return;
    p.angle += p.speed;
    const life = t/PARTICLE_DURATION;
    const riseAmt = t * p.rise * 0.55;
    const cx = p.baseX + Math.cos(p.angle)*p.orbit*(1-life*0.4);
    const cy = p.baseY + Math.sin(p.angle)*p.orbit*0.5*(1-life*0.4) - riseAmt;

    let alpha;
    if(life < 0.15) alpha = life/0.15;
    else if(life > 0.7) alpha = Math.max(0, 1-(life-0.7)/0.3);
    else alpha = 1;

    if(p.type==='smoke'){
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,p.size);
      grad.addColorStop(0, `rgba(180,10,20,${0.45*alpha})`);
      grad.addColorStop(0.5, `rgba(120,5,15,${0.28*alpha})`);
      grad.addColorStop(1, `rgba(80,0,10,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx,cy,p.size,0,Math.PI*2);
      ctx.fill();
    } else {
      const tw = 0.5 + 0.5*Math.sin(elapsed*0.01 + p.twinkle);
      ctx.fillStyle = `rgba(255,${205+Math.floor(30*tw)},${120+Math.floor(60*tw)},${alpha*tw})`;
      ctx.beginPath();
      ctx.arc(cx,cy,p.size*(0.7+0.6*tw),0,Math.PI*2);
      ctx.fill();
      ctx.shadowColor = 'rgba(255,215,140,0.9)';
      ctx.shadowBlur = 6;
    }
    ctx.shadowBlur = 0;
  });

  if(elapsed < PARTICLE_DURATION + 800){
    particleAnimId = requestAnimationFrame(animateParticles);
  } else {
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

// ---- Video sequence ----
function startVideoSequence(){
  videoLayer.classList.add('show');
  const v1 = document.getElementById('v1');
  const v2 = document.getElementById('v2');
  const v3 = document.getElementById('v3');

  function play(video, next){
    video.classList.add('active');
    video.currentTime = 0;
    video.muted = false;
    const p = video.play();
    if(p) p.catch(()=>{ video.muted = true; video.play(); });
    video.onended = ()=>{
      video.classList.remove('active');
      if(next) setTimeout(next, 150);
    };
  }

  play(v1, ()=> play(v2, ()=> play(v3, null)));
}
</script>
</body>
</html>
