<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite Real</title>
<link rel="preload" href="musica.mp3" as="audio">
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#04040a;
    overflow:hidden;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#04040a;
  }
  #frame{
    position:relative;
    width:100%;height:100%;
    max-width:562px; /* keeps 941:1672 ratio inside typical viewport */
    aspect-ratio:941/1672;
    overflow:hidden;
    background:#000;
    touch-action:none;
    box-shadow:0 0 80px rgba(0,0,0,.8);
  }
  @media (min-height: 700px){
    #frame{ height:min(100vh, 940px); width:auto; }
  }
  #frame img, #frame video, #frame canvas{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  /* Alguns Android/Chrome renderizam <video> num overlay de hardware que ignora
     opacity:1 e deixa o conteúdo de trás "vazar". Forçar uma opacidade
     fracionária + camada composta própria evita esse bug. */
  #frame video{
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    background:#000;
  }

  /* ---- Dome: drag wrapper (interaction) + image (fixed alignment) ---- */
  #domeDrag{
    position:absolute; inset:0;
    cursor:grab;
    touch-action:none;
    will-change:transform,opacity;
    filter:drop-shadow(0 30px 25px rgba(0,0,0,.35));
    z-index:8;
  }
  #domeDrag.dragging{ cursor:grabbing; transition:none; }
  #domeDrag.returning{ transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  #domeDrag.removed{ transition:transform 1s cubic-bezier(.5,0,.75,0), opacity 1s ease; }

  #dome{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    /* encaixa o vidro exatamente em volta da rosa/base da nova primeira.jpg */
    transform-origin: 50.05% 68.81%;
    transform: translate(0.159%, -0.449%) scale(1.031, 0.9618);
  }

  #resultLayer{
    position:absolute; inset:0; z-index:10;
    opacity:0; pointer-events:none;
    transition:opacity .6s ease;
  }
  #resultLayer.show{ opacity:0.999; }

  #particleCanvas{ pointer-events:none; z-index:5; }

  #hint{
    position:absolute; left:0; right:0; bottom:8%;
    text-align:center; color:#f5e6c8;
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(14px,3.6vw,18px);
    letter-spacing:.06em;
    text-shadow:0 2px 10px rgba(0,0,0,.8);
    opacity:0; animation:hintFade 1.5s ease .8s forwards;
    z-index:9; pointer-events:none;
  }
  #hint .arrow{ display:block; font-size:1.4em; animation:bob 1.6s ease-in-out infinite; }
  @keyframes hintFade{ to{opacity:.92;} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  #hint.hide{ opacity:0!important; transition:opacity .4s ease; }

  #videoLayer{
    position:absolute; inset:0; z-index:20;
    opacity:0; pointer-events:none;
    transition:opacity .6s ease;
  }
  #videoLayer.show{ opacity:0.999; pointer-events:auto; }

  /* ---- Dica sutil "pular introdução" ---- */
  #skipHint{
    position:absolute; left:0; right:0; bottom:3.2%;
    text-align:center; color:#f2e3c2;
    font-family:Georgia,'Times New Roman',serif;
    font-weight:300;
    font-size:clamp(9px,2.2vw,11px);
    letter-spacing:.16em;
    text-transform:lowercase;
    opacity:0; pointer-events:none;
    transition:opacity 1.4s ease;
    z-index:25;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  #skipHint.show{ opacity:.32; pointer-events:auto; cursor:pointer; }
  #skipHint.show:active{ opacity:.55; }

  /* ---- Botão de música: sutil, dourado, discreto ---- */
  #musicToggle{
    position:absolute; top:3%; right:3.2%; z-index:60;
    width:9.5%; max-width:38px; min-width:26px;
    aspect-ratio:1/1;
    border-radius:50%;
    border:1px solid rgba(212,175,90,.55);
    background:rgba(10,6,4,.28);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    padding:0; cursor:pointer;
    box-shadow:0 0 6px rgba(0,0,0,.25);
    transition:opacity .4s ease, transform .3s ease, border-color .4s ease;
    opacity:.55;
    -webkit-tap-highlight-color:transparent;
  }
  #musicToggle:active{ transform:scale(.9); }
  #musicToggle svg{ width:52%; height:52%; display:block; }
  #musicToggle .wave{ stroke:#e8cf98; transition:opacity .3s ease; }
  #musicToggle.muted .wave{ opacity:0; }
  #musicToggle .body{ fill:#e8cf98; }
  #musicToggle .slash{ stroke:#e8cf98; stroke-width:6; stroke-linecap:round; opacity:0; transition:opacity .3s ease; }
  #musicToggle.muted .slash{ opacity:1; }

  /* ---- Efeito de clique: mini rosas + brilho dourado ---- */
  .click-fx{ position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; z-index:55; }
  .fx-rose{
    position:absolute; left:0; top:0;
    font-size:15px; opacity:0;
    transform:translate(-50%,-50%) scale(.3);
    animation:fxRose .95s ease-out forwards;
  }
  .fx-spark{
    position:absolute; left:0; top:0;
    width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle,#fff6d8,#d4af37 70%,transparent);
    box-shadow:0 0 6px 1px rgba(255,205,110,.85);
    opacity:0;
    transform:translate(-50%,-50%) scale(0);
    animation:fxSpark .75s ease-out forwards;
  }
  @keyframes fxRose{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.25) rotate(0deg); }
    18%{ opacity:1; }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,-40px))) scale(1) rotate(var(--rot,20deg)); }
  }
  @keyframes fxSpark{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0); }
    22%{ opacity:1; }
    100%{ opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,0px))) scale(1); }
  }

  /* ---- Página Interativo ---- */
  #interativoLayer, #presentesLayer{
    position:absolute; inset:0; z-index:30;
    opacity:0; pointer-events:none;
    transition:opacity .7s ease;
  }
  #presentesLayer{ z-index:35; }
  #interativoLayer.show, #presentesLayer.show{ opacity:0.999; pointer-events:auto; }
  #interativoLayer img, #presentesLayer img{
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; display:block;
  }
  .hotspot{
    position:absolute;
    background:transparent; border:none; padding:0; margin:0;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    outline:none;
  }
  .hotspot-back{ top:2.7%; left:59%; width:38%; height:5%; }
  .hotspot-circle{
    width:22%; height:12.6%;
    transform:translate(-50%,-50%);
    border-radius:50%;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <img id="sceneBg" src="primeira.jpg" alt="">
    <div id="resultLayer"><video id="sceneResultVideo" src="resultadodeflorecer.mp4" playsinline></video></div>
    <canvas id="particleCanvas"></canvas>
    <div id="domeDrag">
      <img id="dome" src="sobreposicaoprimeira.jpg" alt="">
    </div>
    <div id="hint"><span class="arrow">☝</span>Arraste a redoma para cima</div>
    <div id="videoLayer"><video id="convite" src="convite.mp4" playsinline></video></div>

    <div id="skipHint">toque para pular introdução</div>

    <button id="musicToggle" aria-label="Ativar ou desativar música" type="button">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path class="body" d="M9 5v9.28A3.5 3.5 0 1 0 11 17V9h6V5H9z"></path>
        <path class="wave" fill="none" stroke-width="1.4" stroke-linecap="round" d="M18.5 8.2c1.1 1 1.1 3.4 0 4.4"></path>
        <path class="wave" fill="none" stroke-width="1.4" stroke-linecap="round" d="M20.3 6.3c2 2 2 6.2 0 8.2"></path>
        <line class="slash" x1="4" y1="4" x2="20" y2="20"></line>
      </svg>
    </button>

    <div id="interativoLayer">
      <img src="interativo.jpg" alt="Página interativa do convite">
      <button class="hotspot hotspot-back" data-action="voltarConviteInicio" aria-label="Voltar ao convite"></button>
      <button class="hotspot hotspot-circle" style="left:22.9%;top:77.2%" data-action="confirmar" aria-label="Confirmar presença"></button>
      <button class="hotspot hotspot-circle" style="left:50.2%;top:77.2%" data-action="localizacao" aria-label="Ver localização"></button>
      <button class="hotspot hotspot-circle" style="left:76.6%;top:77.2%" data-action="presentes" aria-label="Sugestões de presente"></button>
    </div>

    <div id="presentesLayer">
      <img src="presentes.jpg" alt="Sugestões de presente">
      <button class="hotspot hotspot-back" data-action="voltarInterativo" aria-label="Voltar ao convite"></button>
    </div>

    <audio id="bgMusic" src="musica.mp3" loop preload="auto" playsinline></audio>
  </div>
</div>

<script>
const domeDrag = document.getElementById('domeDrag');
const hint = document.getElementById('hint');
const frame = document.getElementById('frame');
const sceneResultVideo = document.getElementById('sceneResultVideo');
const resultLayer = document.getElementById('resultLayer');
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const videoLayer = document.getElementById('videoLayer');
const conviteVideo = document.getElementById('convite');

let dragging=false, startY=0, currentDelta=0, removed=false;

function resizeCanvas(){
  const r = frame.getBoundingClientRect();
  canvas.width = r.width; canvas.height = r.height;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ---- Drag interaction ----
domeDrag.addEventListener('pointerdown', (e)=>{
  if(removed) return;
  dragging = true;
  startY = e.clientY;
  domeDrag.classList.remove('returning');
  domeDrag.classList.add('dragging');
  domeDrag.setPointerCapture(e.pointerId);
  hint.classList.add('hide');
  startParticles(); // smoke begins rising as soon as the person starts pulling the dome
  tryStartMusic();
});

domeDrag.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  let dy = startY - e.clientY;
  if(dy < 0) dy = 0;
  currentDelta = dy;
  const fade = Math.max(0, 1 - dy/420);
  domeDrag.style.transform = `translateY(${-dy}px) rotate(${-dy*0.02}deg)`;
  domeDrag.style.opacity = fade;
});

function endDrag(e){
  if(!dragging) return;
  dragging = false;
  domeDrag.classList.remove('dragging');
  if(currentDelta > 140){
    liftDomeAway();
  } else {
    domeDrag.classList.add('returning');
    domeDrag.style.transform = 'translateY(0) rotate(0deg)';
    domeDrag.style.opacity = 1;
    hint.classList.remove('hide');
    stopParticles(); // dome went back down, smoke fades out immediately
  }
  currentDelta = 0;
}
domeDrag.addEventListener('pointerup', endDrag);
domeDrag.addEventListener('pointercancel', endDrag);

// ---- Sequence after dome is lifted ----
function liftDomeAway(){
  removed = true;
  domeDrag.classList.add('removed');
  domeDrag.style.transform = 'translateY(-1300px) rotate(-8deg)';
  domeDrag.style.opacity = '0';

  // let the smoke finish its rise, then the flowering video starts on its own
  const elapsed = performance.now() - particleStart;
  const wait = Math.max(300, (PARTICLE_DURATION - elapsed) + 300);
  setTimeout(startResultVideo, wait);
}

function startResultVideo(){
  resultLayer.classList.add('show');
  sceneResultVideo.currentTime = 0;
  sceneResultVideo.muted = false;
  const p = sceneResultVideo.play();
  if(p) p.catch(()=>{ sceneResultVideo.muted = true; sceneResultVideo.play(); });
  showSkipHint();

  sceneResultVideo.onended = ()=>{
    startConvite();
  };
}

function startConvite(){
  videoLayer.classList.add('show');
  conviteVideo.currentTime = 0;
  conviteVideo.muted = false;
  const p = conviteVideo.play();
  if(p) p.catch(()=>{ conviteVideo.muted = true; conviteVideo.play(); });
  showSkipHint();

  conviteVideo.onended = ()=>{
    resultLayer.classList.remove('show');
    goToInterativo();
  };
}

// ---- Particle system: red smoke + gold glitter (dome lift) ----
let particles = [];
let particleAnimId = null;
let particleStart = 0;
const PARTICLE_DURATION = 3200;

function startParticles(){
  particles = [];
  const r = frame.getBoundingClientRect();
  const originX = r.width * 0.505;
  const originY = r.height * 0.66;

  for(let i=0;i<38;i++){
    particles.push(makeSmoke(originX, originY));
  }
  for(let i=0;i<70;i++){
    particles.push(makeGlitter(originX, originY));
  }
  particleStart = performance.now();
  if(particleAnimId) cancelAnimationFrame(particleAnimId);
  animateParticles();
}

function stopParticles(){
  if(particleAnimId) cancelAnimationFrame(particleAnimId);
  particleAnimId = null;
  particles = [];
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function makeSmoke(ox,oy){
  const angle = Math.random()*Math.PI*2;
  const radius = 10 + Math.random()*40;
  return{
    type:'smoke',
    x: ox + Math.cos(angle)*radius,
    y: oy + Math.sin(angle)*radius*0.4,
    baseX: ox, baseY: oy,
    angle: angle,
    orbit: 30 + Math.random()*70,
    speed: 0.02 + Math.random()*0.02,
    rise: 0.35 + Math.random()*0.55,
    size: 18 + Math.random()*46,
    delay: Math.random()*400,
    alpha: 0
  };
}
function makeGlitter(ox,oy){
  const angle = Math.random()*Math.PI*2;
  const radius = 5 + Math.random()*60;
  return{
    type:'glitter',
    x: ox + Math.cos(angle)*radius,
    y: oy + Math.sin(angle)*radius*0.4,
    baseX: ox, baseY: oy,
    angle: angle,
    orbit: 20 + Math.random()*90,
    speed: 0.035 + Math.random()*0.035,
    rise: 0.5 + Math.random()*0.9,
    size: 1.4 + Math.random()*2.6,
    twinkle: Math.random()*Math.PI*2,
    delay: Math.random()*600,
    alpha: 0
  };
}

function animateParticles(){
  const now = performance.now();
  const elapsed = now - particleStart;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    const t = elapsed - p.delay;
    if(t < 0) return;
    p.angle += p.speed;
    const life = t/PARTICLE_DURATION;
    const riseAmt = t * p.rise * 0.55;
    const cx = p.baseX + Math.cos(p.angle)*p.orbit*(1-life*0.4);
    const cy = p.baseY + Math.sin(p.angle)*p.orbit*0.5*(1-life*0.4) - riseAmt;

    let alpha;
    if(life < 0.15) alpha = life/0.15;
    else if(life > 0.7) alpha = Math.max(0, 1-(life-0.7)/0.3);
    else alpha = 1;

    if(p.type==='smoke'){
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,p.size);
      grad.addColorStop(0, `rgba(180,10,20,${0.45*alpha})`);
      grad.addColorStop(0.5, `rgba(120,5,15,${0.28*alpha})`);
      grad.addColorStop(1, `rgba(80,0,10,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx,cy,p.size,0,Math.PI*2);
      ctx.fill();
    } else {
      const tw = 0.5 + 0.5*Math.sin(elapsed*0.01 + p.twinkle);
      ctx.fillStyle = `rgba(255,${205+Math.floor(30*tw)},${120+Math.floor(60*tw)},${alpha*tw})`;
      ctx.beginPath();
      ctx.arc(cx,cy,p.size*(0.7+0.6*tw),0,Math.PI*2);
      ctx.fill();
      ctx.shadowColor = 'rgba(255,215,140,0.9)';
      ctx.shadowBlur = 6;
    }
    ctx.shadowBlur = 0;
  });

  if(elapsed < PARTICLE_DURATION + 800){
    particleAnimId = requestAnimationFrame(animateParticles);
  } else {
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

// ==================================================================
// Música de fundo
// ==================================================================
const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
let userMuted = false;    // true somente se a pessoa apertar o botão de mudo
let musicPlaying = false; // true assim que o navegador confirmar que está tocando

bgMusic.volume = 0.85;
bgMusic.muted = true;
bgMusic.load();

function tryStartMusic(){
  if(musicPlaying) return; // já está tocando, não precisa insistir
  if(!userMuted) bgMusic.muted = false;
  const p = bgMusic.play();
  if(p){
    p.then(()=>{ musicPlaying = true; })
     .catch(()=>{ /* este navegador ainda bloqueou; a próxima interação tenta de novo */ });
  }
}

// tentativa inicial, mudo, sem esperar nenhum toque (funciona na maioria dos navegadores)
tryStartMusic();

// insiste em QUALQUER tipo de interação, em qualquer navegador/webview,
// até conseguir tocar (Chrome, Safari, WhatsApp/Instagram in-app browser etc.)
['pointerdown','touchstart','touchend','mousedown','click','keydown'].forEach(evt=>{
  document.addEventListener(evt, tryStartMusic, { passive:true });
});

musicToggle.addEventListener('click', (e)=>{
  e.stopPropagation();
  userMuted = !userMuted;
  bgMusic.muted = userMuted;
  if(userMuted){
    musicPlaying = false; // ao mutar, deixamos pronto para "retocar" quando desmutar
  } else {
    musicPlaying = false;
    tryStartMusic();
  }
  musicToggle.classList.toggle('muted', userMuted);
});

// ==================================================================
// Dica sutil "toque para pular introdução"
// ==================================================================
const skipHint = document.getElementById('skipHint');
let skipHintTimer = null;

function showSkipHint(){
  clearTimeout(skipHintTimer);
  skipHintTimer = setTimeout(()=>{ skipHint.classList.add('show'); }, 1800);
}
function hideSkipHint(){
  clearTimeout(skipHintTimer);
  skipHint.classList.remove('show');
}
skipHint.addEventListener('click', ()=>{
  conviteVideo.pause();
  sceneResultVideo.pause();
  goToInterativo();
});

// ==================================================================
// Navegação: página Interativo / página Presentes
// ==================================================================
const interativoLayer = document.getElementById('interativoLayer');
const presentesLayer = document.getElementById('presentesLayer');

function goToInterativo(){
  hideSkipHint();
  videoLayer.classList.remove('show');
  resultLayer.classList.remove('show');
  presentesLayer.classList.remove('show');
  interativoLayer.classList.add('show');
}

function voltarAoInicioDoConvite(){
  // reinicia o convite inteiro, do começo (primeira página/vídeo)
  location.reload();
}

document.querySelectorAll('.hotspot').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const action = btn.dataset.action;
    if(action === 'voltarConviteInicio'){
      voltarAoInicioDoConvite();
    } else if(action === 'voltarInterativo'){
      presentesLayer.classList.remove('show');
    } else if(action === 'presentes'){
      presentesLayer.classList.add('show');
    } else if(action === 'confirmar'){
      window.open('https://wa.link/v7suiq', '_blank');
    } else if(action === 'localizacao'){
      window.open('https://maps.app.goo.gl/whz3KmGZdt8mxYTy7', '_blank');
    }
  });
});

// ==================================================================
// Efeito de clique: mini rosas + brilho dourado em qualquer toque
// ==================================================================
const ROSE_GLYPHS = ['🌹','🌸'];

function spawnClickEffect(x, y){
  const fx = document.createElement('div');
  fx.className = 'click-fx';
  fx.style.left = x + 'px';
  fx.style.top = y + 'px';

  const roseCount = 2 + Math.floor(Math.random()*2);
  for(let i=0;i<roseCount;i++){
    const r = document.createElement('span');
    r.className = 'fx-rose';
    r.textContent = ROSE_GLYPHS[Math.floor(Math.random()*ROSE_GLYPHS.length)];
    const angle = Math.random()*Math.PI*2;
    const dist = 18 + Math.random()*26;
    r.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    r.style.setProperty('--dy', (Math.sin(angle)*dist - 30)+'px');
    r.style.setProperty('--rot', (Math.random()*40-20)+'deg');
    r.style.animationDelay = (Math.random()*0.08)+'s';
    fx.appendChild(r);
  }

  const sparkCount = 9 + Math.floor(Math.random()*6);
  for(let i=0;i<sparkCount;i++){
    const s = document.createElement('span');
    s.className = 'fx-spark';
    const angle = Math.random()*Math.PI*2;
    const dist = 14 + Math.random()*36;
    s.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    s.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
    s.style.animationDelay = (Math.random()*0.12)+'s';
    fx.appendChild(s);
  }

  frame.appendChild(fx);
  setTimeout(()=>{ fx.remove(); }, 1200);
}

frame.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('#musicToggle')) return;
  const r = frame.getBoundingClientRect();
  spawnClickEffect(e.clientX - r.left, e.clientY - r.top);
});
</script>
</body>
</html>
