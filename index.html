<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-1:#fff3c4;
    --gold-2:#e8b84b;
    --gold-3:#9a6a12;
    --red-1:#8a0303;
    --red-2:#c40808;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#04040a;
    overflow:hidden;
    font-family:'Cormorant Garamond',serif;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#04040a;
  }
  #frame{
    position:relative;
    width:100%;height:100%;
    max-width:562px; /* keeps 941:1672 ratio inside typical viewport */
    aspect-ratio:941/1672;
    overflow:hidden;
    background:#000;
    touch-action:none;
    box-shadow:0 0 80px rgba(0,0,0,.8);
  }
  @media (min-height: 700px){
    #frame{ height:min(100vh, 940px); width:auto; }
  }
  #frame img, #frame video, #frame canvas{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  /* Alguns Android/Chrome renderizam <video> num overlay de hardware que ignora
     opacity:1 e deixa o conteúdo de trás "vazar". Forçar uma opacidade
     fracionária + camada composta própria evita esse bug. */
  #frame video{
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    background:#000;
  }

  /* ---- Dome: drag wrapper (interaction) + image (fixed alignment) ---- */
  #domeDrag{
    position:absolute; inset:0;
    cursor:grab;
    touch-action:none;
    will-change:transform,opacity;
    filter:drop-shadow(0 30px 25px rgba(0,0,0,.35));
    z-index:8;
  }
  #domeDrag.dragging{ cursor:grabbing; transition:none; }
  #domeDrag.returning{ transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  #domeDrag.removed{ transition:transform 1s cubic-bezier(.5,0,.75,0), opacity 1s ease; }

  #dome{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    /* aligns the glass overlay exactly onto the glass in the background photo */
    transform: translate(0.6%, -6.5%) scale(0.754, 0.682);
    transform-origin:center center;
  }

  #sceneResultVideo{
    opacity:0; z-index:10;
    pointer-events:none;
    transition:opacity .6s ease;
  }
  #sceneResultVideo.show{ opacity:0.999; }

  #particleCanvas{ pointer-events:none; z-index:5; }

  #hint{
    position:absolute; left:0; right:0; bottom:8%;
    text-align:center; color:#f5e6c8;
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(14px,3.6vw,18px);
    letter-spacing:.06em;
    text-shadow:0 2px 10px rgba(0,0,0,.8);
    opacity:0; animation:hintFade 1.5s ease .8s forwards;
    z-index:9; pointer-events:none;
  }
  #hint .arrow{ display:block; font-size:1.4em; animation:bob 1.6s ease-in-out infinite; }
  @keyframes hintFade{ to{opacity:.92;} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  #hint.hide{ opacity:0!important; transition:opacity .4s ease; }

  /* ---- Golden 3D elegant phrase (same style/typography as the invite art) ---- */
  #phrase{
    position:absolute; left:50%; top:13%;
    transform:translate(-50%,-10px) scale(.9);
    width:84%; text-align:center;
    font-family:'Great Vibes', cursive;
    font-size:clamp(25px,7vw,40px);
    line-height:1.28;
    z-index:26; opacity:0; pointer-events:none;
    background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 45%,var(--gold-3) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:
      drop-shadow(0 0 2px var(--red-2))
      drop-shadow(0 0 12px rgba(196,8,8,.55))
      drop-shadow(0 2px 0 var(--red-1))
      drop-shadow(0 4px 8px rgba(0,0,0,.6));
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
  }
  #phrase.show{ opacity:1; transform:translate(-50%,0) scale(1); }

  #videoLayer{
    position:absolute; inset:0; background:#000;
    opacity:0; pointer-events:none; transition:opacity 1.2s ease; z-index:20;
  }
  #videoLayer.show{ opacity:1; pointer-events:auto; }
  #videoLayer video{ opacity:0; transition:opacity .35s ease; }
  #videoLayer video.active{ opacity:0.999; }

  /* ---- Transition between clips: subtle red smoke + gold glitter burst ---- */
  #transitionCanvas{ position:absolute; inset:0; z-index:24; pointer-events:none; }
  #transitionFx{
    position:absolute; inset:0; z-index:23; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 55%, rgba(196,8,8,.5), rgba(120,0,10,.3) 45%, transparent 72%);
    mix-blend-mode:screen;
  }
  #transitionFx.burst{ animation:fxPulse .6s ease; }
  @keyframes fxPulse{ 0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;} }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <img id="sceneBg" src="primeira.jpg" alt="">
    <video id="sceneResultVideo" src="resultadodeflorecer.mp4" playsinline></video>
    <canvas id="particleCanvas"></canvas>
    <div id="domeDrag">
      <img id="dome" src="sobreposicaoprimeira.jpg" alt="">
    </div>
    <div id="hint"><span class="arrow">☝</span>Arraste a redoma para cima</div>
    <div id="phrase"></div>
    <div id="videoLayer">
      <video id="v1" src="video1.mp4" playsinline></video>
      <video id="v2" src="video2.mp4" playsinline></video>
      <video id="v3" src="video3.mp4" playsinline></video>
    </div>
    <canvas id="transitionCanvas"></canvas>
    <div id="transitionFx"></div>
  </div>
</div>

<script>
const domeDrag = document.getElementById('domeDrag');
const hint = document.getElementById('hint');
const frame = document.getElementById('frame');
const sceneResultVideo = document.getElementById('sceneResultVideo');
const phraseEl = document.getElementById('phrase');
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const transitionCanvas = document.getElementById('transitionCanvas');
const tctx = transitionCanvas.getContext('2d');
const transitionFx = document.getElementById('transitionFx');
const videoLayer = document.getElementById('videoLayer');

const FRASE1 = "Em um jardim onde a magia floresce, um novo capítulo da minha história começa...";
const FRASE2 = "Você está convidado para comemorar meus XV anos.";
const FRASE3 = "Estou te esperando.";

let dragging=false, startY=0, currentDelta=0, removed=false;

function resizeCanvas(){
  const r = frame.getBoundingClientRect();
  canvas.width = r.width; canvas.height = r.height;
  transitionCanvas.width = r.width; transitionCanvas.height = r.height;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ---- Golden phrase overlay ----
let phraseTimer = null;
function showPhrase(text, holdMs=4200){
  clearTimeout(phraseTimer);
  phraseEl.textContent = text;
  // force reflow so re-showing the same text restarts the fade nicely
  void phraseEl.offsetWidth;
  phraseEl.classList.add('show');
  phraseTimer = setTimeout(()=>{
    phraseEl.classList.remove('show');
  }, holdMs);
}

function attachEndPhrase(video, text, leadSeconds=4.5){
  let shown = false;
  video.addEventListener('timeupdate', function handler(){
    if(!shown && video.duration && (video.duration - video.currentTime) <= leadSeconds){
      shown = true;
      const hold = Math.max(1500, Math.min(4500, (video.duration - video.currentTime + 0.3) * 1000));
      showPhrase(text, hold);
      video.removeEventListener('timeupdate', handler);
    }
  });
}

// ---- Drag interaction ----
domeDrag.addEventListener('pointerdown', (e)=>{
  if(removed) return;
  dragging = true;
  startY = e.clientY;
  domeDrag.classList.remove('returning');
  domeDrag.classList.add('dragging');
  domeDrag.setPointerCapture(e.pointerId);
  hint.classList.add('hide');
  startParticles(); // smoke begins rising as soon as the person starts pulling the dome
});

domeDrag.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  let dy = startY - e.clientY;
  if(dy < 0) dy = 0;
  currentDelta = dy;
  const fade = Math.max(0, 1 - dy/420);
  domeDrag.style.transform = `translateY(${-dy}px) rotate(${-dy*0.02}deg)`;
  domeDrag.style.opacity = fade;
});

function endDrag(e){
  if(!dragging) return;
  dragging = false;
  domeDrag.classList.remove('dragging');
  if(currentDelta > 140){
    liftDomeAway();
  } else {
    domeDrag.classList.add('returning');
    domeDrag.style.transform = 'translateY(0) rotate(0deg)';
    domeDrag.style.opacity = 1;
    hint.classList.remove('hide');
    stopParticles(); // dome went back down, smoke fades out immediately
  }
  currentDelta = 0;
}
domeDrag.addEventListener('pointerup', endDrag);
domeDrag.addEventListener('pointercancel', endDrag);

// ---- Sequence after dome is lifted ----
function liftDomeAway(){
  removed = true;
  domeDrag.classList.add('removed');
  domeDrag.style.transform = 'translateY(-1300px) rotate(-8deg)';
  domeDrag.style.opacity = '0';

  // let the smoke finish its rise, then the flowering video starts on its own
  const elapsed = performance.now() - particleStart;
  const wait = Math.max(300, (PARTICLE_DURATION - elapsed) + 300);
  setTimeout(startResultVideo, wait);
}

function startResultVideo(){
  sceneResultVideo.classList.add('show');
  sceneResultVideo.currentTime = 0;
  sceneResultVideo.muted = false;
  const p = sceneResultVideo.play();
  if(p) p.catch(()=>{ sceneResultVideo.muted = true; sceneResultVideo.play(); });

  setTimeout(()=> showPhrase(FRASE1), 900);

  sceneResultVideo.onended = ()=>{
    transitionThen(()=>{
      sceneResultVideo.classList.remove('show');
      startVideoSequence();
    });
  };
}

// ---- Particle system: red smoke + gold glitter (dome lift) ----
let particles = [];
let particleAnimId = null;
let particleStart = 0;
const PARTICLE_DURATION = 3200;

function startParticles(){
  particles = [];
  const r = frame.getBoundingClientRect();
  const originX = r.width * 0.505;
  const originY = r.height * 0.62;

  for(let i=0;i<38;i++){
    particles.push(makeSmoke(originX, originY));
  }
  for(let i=0;i<70;i++){
    particles.push(makeGlitter(originX, originY));
  }
  particleStart = performance.now();
  if(particleAnimId) cancelAnimationFrame(particleAnimId);
  animateParticles();
}

function stopParticles(){
  if(particleAnimId) cancelAnimationFrame(particleAnimId);
  particleAnimId = null;
  particles = [];
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function makeSmoke(ox,oy){
  const angle = Math.random()*Math.PI*2;
  const radius = 10 + Math.random()*40;
  return{
    type:'smoke',
    x: ox + Math.cos(angle)*radius,
    y: oy + Math.sin(angle)*radius*0.4,
    baseX: ox, baseY: oy,
    angle: angle,
    orbit: 30 + Math.random()*70,
    speed: 0.02 + Math.random()*0.02,
    rise: 0.35 + Math.random()*0.55,
    size: 18 + Math.random()*46,
    delay: Math.random()*400,
    alpha: 0
  };
}
function makeGlitter(ox,oy){
  const angle = Math.random()*Math.PI*2;
  const radius = 5 + Math.random()*60;
  return{
    type:'glitter',
    x: ox + Math.cos(angle)*radius,
    y: oy + Math.sin(angle)*radius*0.4,
    baseX: ox, baseY: oy,
    angle: angle,
    orbit: 20 + Math.random()*90,
    speed: 0.035 + Math.random()*0.035,
    rise: 0.5 + Math.random()*0.9,
    size: 1.4 + Math.random()*2.6,
    twinkle: Math.random()*Math.PI*2,
    delay: Math.random()*600,
    alpha: 0
  };
}

function animateParticles(){
  const now = performance.now();
  const elapsed = now - particleStart;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    const t = elapsed - p.delay;
    if(t < 0) return;
    p.angle += p.speed;
    const life = t/PARTICLE_DURATION;
    const riseAmt = t * p.rise * 0.55;
    const cx = p.baseX + Math.cos(p.angle)*p.orbit*(1-life*0.4);
    const cy = p.baseY + Math.sin(p.angle)*p.orbit*0.5*(1-life*0.4) - riseAmt;

    let alpha;
    if(life < 0.15) alpha = life/0.15;
    else if(life > 0.7) alpha = Math.max(0, 1-(life-0.7)/0.3);
    else alpha = 1;

    if(p.type==='smoke'){
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,p.size);
      grad.addColorStop(0, `rgba(180,10,20,${0.45*alpha})`);
      grad.addColorStop(0.5, `rgba(120,5,15,${0.28*alpha})`);
      grad.addColorStop(1, `rgba(80,0,10,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx,cy,p.size,0,Math.PI*2);
      ctx.fill();
    } else {
      const tw = 0.5 + 0.5*Math.sin(elapsed*0.01 + p.twinkle);
      ctx.fillStyle = `rgba(255,${205+Math.floor(30*tw)},${120+Math.floor(60*tw)},${alpha*tw})`;
      ctx.beginPath();
      ctx.arc(cx,cy,p.size*(0.7+0.6*tw),0,Math.PI*2);
      ctx.fill();
      ctx.shadowColor = 'rgba(255,215,140,0.9)';
      ctx.shadowBlur = 6;
    }
    ctx.shadowBlur = 0;
  });

  if(elapsed < PARTICLE_DURATION + 800){
    particleAnimId = requestAnimationFrame(animateParticles);
  } else {
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

// ---- Transition burst: quick red smoke + gold glitter between clips (~0.6s) ----
let tParticles = [];
let tAnimId = null;
let tStart = 0;
const T_DURATION = 600;

function spawnTransitionBurst(){
  tParticles = [];
  const r = frame.getBoundingClientRect();
  for(let i=0;i<16;i++){
    tParticles.push({
      type:'smoke',
      x: Math.random()*r.width, y: Math.random()*r.height,
      size: 40+Math.random()*70, delay: Math.random()*120
    });
  }
  for(let i=0;i<40;i++){
    tParticles.push({
      type:'glitter',
      x: Math.random()*r.width, y: Math.random()*r.height,
      size: 1.5+Math.random()*2.5, twinkle: Math.random()*Math.PI*2, delay: Math.random()*150
    });
  }
  tStart = performance.now();
  if(tAnimId) cancelAnimationFrame(tAnimId);
  animateTransition();
}

function animateTransition(){
  const now = performance.now();
  const elapsed = now - tStart;
  tctx.clearRect(0,0,transitionCanvas.width,transitionCanvas.height);

  tParticles.forEach(p=>{
    const t = elapsed - p.delay;
    if(t < 0) return;
    const life = t/T_DURATION;
    let alpha;
    if(life < 0.25) alpha = life/0.25;
    else if(life > 0.6) alpha = Math.max(0, 1-(life-0.6)/0.4);
    else alpha = 1;

    if(p.type==='smoke'){
      const grad = tctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
      grad.addColorStop(0, `rgba(190,10,20,${0.5*alpha})`);
      grad.addColorStop(0.5, `rgba(120,5,15,${0.3*alpha})`);
      grad.addColorStop(1, 'rgba(80,0,10,0)');
      tctx.fillStyle = grad;
      tctx.beginPath();
      tctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      tctx.fill();
    } else {
      const tw = 0.5 + 0.5*Math.sin(elapsed*0.02 + p.twinkle);
      tctx.fillStyle = `rgba(255,${210+Math.floor(25*tw)},${140+Math.floor(50*tw)},${alpha*tw})`;
      tctx.beginPath();
      tctx.arc(p.x,p.y,p.size*(0.7+0.6*tw),0,Math.PI*2);
      tctx.fill();
    }
  });

  if(elapsed < T_DURATION + 150){
    tAnimId = requestAnimationFrame(animateTransition);
  } else {
    tctx.clearRect(0,0,transitionCanvas.width,transitionCanvas.height);
  }
}

function transitionThen(callback){
  spawnTransitionBurst();
  transitionFx.classList.remove('burst');
  void transitionFx.offsetWidth; // reset animation so it can replay
  transitionFx.classList.add('burst');
  setTimeout(callback, 280); // swap the clip while the smoke is at its peak
}

// ---- Video sequence: resultadodeflorecer.mp4 -> video1 -> video2 -> video3 ----
function playVideo(video, opts={}){
  const { phrase, phraseDelay=900, onEnd } = opts;
  video.classList.add('active');
  video.currentTime = 0;
  video.muted = false;
  const p = video.play();
  if(p) p.catch(()=>{ video.muted = true; video.play(); });
  if(phrase){
    setTimeout(()=> showPhrase(phrase), phraseDelay);
  }
  video.onended = ()=>{
    video.classList.remove('active');
    if(onEnd) transitionThen(onEnd);
  };
}

function startVideoSequence(){
  videoLayer.classList.add('show');
  const v1 = document.getElementById('v1');
  const v2 = document.getElementById('v2');
  const v3 = document.getElementById('v3');

  attachEndPhrase(v3, FRASE3, 4.5);

  playVideo(v1, {
    phrase: FRASE2,
    onEnd: ()=> playVideo(v2, {
      onEnd: ()=> playVideo(v3, {})
    })
  });
}
</script>
</body>
</html>
